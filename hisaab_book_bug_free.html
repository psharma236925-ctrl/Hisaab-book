<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hisaab Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .timeline-line::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 15px; width: 2px; background: #e2e8f0; z-index: 0;
        }
    </style>
</head>
<body class="text-gray-800 bg-gray-50 h-screen flex flex-col relative overflow-hidden">

    <header class="bg-indigo-600 text-white p-4 shadow-md shrink-0 z-10 relative">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold tracking-tight"><i class="fa-solid fa-book-open mr-2"></i>Hisaab Book</h1>
            <button onclick="openUpiSettings()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-gear"></i> Setup UPI
            </button>
        </div>
        
        <!-- Global Stats -->
        <div class="grid grid-cols-2 gap-2 text-center bg-indigo-700/80 p-3 rounded-xl shadow-inner border border-indigo-500/50 mb-4 backdrop-blur-sm">
            <div>
                <p class="text-[11px] text-indigo-200 mb-0.5 font-medium uppercase tracking-wider">Lene Baaki Hain</p>
                <p class="text-xl font-bold text-green-300" id="dash-total-receive">₹0</p>
            </div>
            <div class="border-l border-indigo-500/50">
                <p class="text-[11px] text-indigo-200 mb-0.5 font-medium uppercase tracking-wider">Dene Baaki Hain</p>
                <p class="text-xl font-bold text-red-300" id="dash-total-pay">₹0</p>
            </div>
        </div>

        <!-- Tabs for Lent vs Borrowed -->
        <div class="flex bg-indigo-900/50 rounded-lg p-1 relative shadow-inner">
            <button onclick="switchTab('lent')" id="tab-lent" class="flex-1 py-2.5 text-sm font-bold rounded-md bg-white text-indigo-700 shadow transition flex items-center justify-center gap-2">
                Maine Diye ⬆️
            </button>
            <button onclick="switchTab('borrowed')" id="tab-borrowed" class="flex-1 py-2.5 text-sm font-bold rounded-md text-indigo-100 hover:text-white transition flex items-center justify-center gap-2">
                Maine Liye ⬇️
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 relative bg-gray-50/50" id="main-list">
        <!-- List will be populated here by JS -->
    </main>

    <div class="p-4 shrink-0 bg-white border-t border-gray-200 z-10 pb-6 sm:pb-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button id="btn-add-khata" onclick="openFormModal(null)" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 hover:bg-indigo-700 transition active:scale-95 shadow-lg">
            <i class="fa-solid fa-plus text-lg"></i> Naya Udhaar (Diya)
        </button>
    </div>

    <div id="modal-form" class="fixed inset-0 bg-black/60 hidden z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <h2 id="form-title" class="text-lg font-bold text-gray-800">Naya Khata</h2>
                <button onclick="closeModal('modal-form')" class="text-gray-400 hover:text-red-500 text-2xl transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1">
                <input type="hidden" id="form-person-id">
                <input type="hidden" id="form-txn-id">
                <input type="hidden" id="form-txn-type" value="given">

                <!-- Type Selector -->
                <div id="type-selector" class="flex gap-2 mb-5 bg-gray-100 p-1.5 rounded-xl">
                    <button type="button" id="btn-type-given" onclick="setTxnType('given')" class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-red-600 shadow-sm transition">Diye (-)</button>
                    <button type="button" id="btn-type-received" onclick="setTxnType('received')" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-500 transition">Aaye (+)</button>
                </div>
                
                <div class="mb-5" id="name-container">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Insaan ka Naam</label>
                    <div class="relative">
                        <i class="fa-regular fa-user absolute left-3.5 top-3.5 text-gray-400"></i>
                        <input type="text" id="form-name" class="w-full border border-gray-300 rounded-xl py-3 pl-10 pr-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="Jaise: Rahul bhai...">
                    </div>
                </div>
                
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Kitne Paise?</label>
                    <div class="relative">
                        <span class="absolute left-3.5 top-3 font-bold text-gray-500 text-lg">₹</span>
                        <input type="number" id="form-amount" class="w-full border border-gray-300 rounded-xl py-3 pl-9 pr-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-xl font-bold text-gray-800 transition" placeholder="0" pattern="[0-9]*" inputmode="numeric">
                    </div>
                </div>
                
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Date (Tareekh)</label>
                    <input type="date" id="form-date" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-gray-700 font-medium transition">
                </div>
                
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Note (Zaroori nahi)</label>
                    <input type="text" id="form-note" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="Kis liye the?">
                </div>
                
                <div class="mb-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Screenshot / Photo <span class="text-xs font-normal text-gray-400">(Optional)</span></label>
                    <input type="file" id="form-image" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition cursor-pointer">
                    <div id="image-preview-container" class="mt-3 hidden relative inline-block">
                        <img id="form-image-preview" src="" class="h-24 w-24 rounded-xl border border-gray-200 object-cover shadow-sm">
                        <button type="button" onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs shadow-md hover:bg-red-600 transition"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t bg-gray-50 rounded-b-2xl">
                <button onclick="saveTransaction()" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition active:scale-95 shadow-md text-lg">
                    Save Karein
                </button>
            </div>
        </div>
    </div>

    <div id="modal-details" class="fixed inset-0 bg-black/70 hidden z-[50] flex flex-col backdrop-blur-sm transition-opacity">
        <div class="bg-white flex-1 flex flex-col mt-8 sm:mt-12 rounded-t-3xl sm:rounded-2xl sm:mb-8 sm:mx-4 overflow-hidden shadow-2xl relative">
            
            <div class="bg-indigo-600 text-white p-4 shrink-0 flex items-center justify-between shadow-md z-10">
                <div class="flex items-center gap-3">
                    <button onclick="closeModal('modal-details')" class="text-white hover:text-indigo-200 text-xl py-1 pr-2 transition"><i class="fa-solid fa-arrow-left"></i></button>
                    <div>
                        <h2 class="font-bold text-xl flex items-center gap-2 tracking-wide">
                            <span id="detail-name">Name</span>
                            <button onclick="openEditName()" class="text-indigo-200 hover:text-white text-sm bg-indigo-800/60 p-1.5 rounded-lg transition"><i class="fa-solid fa-pen"></i></button>
                        </h2>
                    </div>
                </div>
                <button onclick="deletePerson()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-1.5"><i class="fa-solid fa-trash"></i> <span class="hidden sm:inline">Delete Khata</span></button>
            </div>
            
            <div class="p-5 bg-indigo-50 shrink-0 border-b border-indigo-100 z-10 shadow-sm relative">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-gray-700 text-sm uppercase tracking-wider" id="detail-pending-label">Baaki Hain:</span>
                    <span class="font-bold text-indigo-700 text-3xl" id="detail-pending">₹0</span>
                </div>
                <div class="flex gap-3" id="reminder-actions">
                    <button id="btn-reminder" class="flex-1 bg-[#25D366] text-white py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-[#1ebd5a] transition shadow-md active:scale-95">
                        <i class="fa-brands fa-whatsapp text-xl"></i> WhatsApp
                    </button>
                    <button id="btn-show-qr" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700 transition shadow-md active:scale-95">
                        <i class="fa-solid fa-qrcode text-lg"></i> Scan & Pay
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 bg-gray-50/80">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-5 border-b border-gray-200 pb-2">Len-Den History</h3>
                <div id="timeline-container" class="relative timeline-line">
                    <!-- History items go here -->
                </div>
            </div>
            
            <div class="p-4 border-t border-gray-200 bg-white flex gap-3 shrink-0 pb-6 sm:pb-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
                <button id="btn-action-left" onclick="openFormForExisting('received')" class="flex-1 bg-green-50 text-green-700 font-bold py-3.5 rounded-xl border-2 border-green-200 hover:bg-green-100 transition active:scale-95 flex items-center justify-center gap-2 shadow-sm text-sm sm:text-base">
                    <i class="fa-solid fa-arrow-down"></i> Aaye (+)
                </button>
                <button id="btn-action-right" onclick="openFormForExisting('given')" class="flex-1 bg-red-50 text-red-700 font-bold py-3.5 rounded-xl border-2 border-red-200 hover:bg-red-100 transition active:scale-95 flex items-center justify-center gap-2 shadow-sm text-sm sm:text-base">
                    <i class="fa-solid fa-arrow-up"></i> Aur Diye (-)
                </button>
            </div>
        </div>
    </div>

    <div id="modal-name" class="fixed inset-0 bg-black/60 hidden z-[70] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform scale-100 transition-transform">
            <h3 class="font-bold text-xl text-gray-900 mb-4">Naam Badlein</h3>
            <input type="text" id="edit-name-input" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none mb-5 font-medium text-gray-800">
            <div class="flex gap-3">
                <button onclick="closeModal('modal-name')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-200 transition">Cancel</button>
                <button onclick="saveName()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-md">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="modal-upi" class="fixed inset-0 bg-black/60 hidden z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
            <button onclick="closeModal('modal-upi')" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="font-bold text-xl text-gray-900 mb-2">Online Payment Setup</h3>
            <p class="text-gray-500 text-sm mb-5 leading-relaxed">Ise set karne se aap paise mangne ke liye direct QR Code aur UPI link generate kar payenge.</p>
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Aapka Naam (Bank me)</label>
                <input type="text" id="upi-name" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="Rahul Kumar">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Aapki UPI ID</label>
                <input type="text" id="upi-id" class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition font-mono text-sm" placeholder="mobile@upi">
            </div>
            <button onclick="saveUpiSettings()" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition active:scale-95 shadow-md">Save Details</button>
        </div>
    </div>

    <div id="modal-qr" class="fixed inset-0 bg-black/70 hidden z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-24 bg-indigo-600 -z-10 rounded-b-[50%]"></div>
            <button onclick="closeModal('modal-qr')" class="absolute top-4 right-4 text-white hover:text-gray-200 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="font-bold text-xl text-white mb-6">Scan & Pay</h3>
            
            <div class="bg-white p-3 rounded-2xl border-4 border-gray-100 inline-block mb-5 shadow-lg relative z-10">
                <img id="qr-img" src="" alt="UPI QR Code" class="w-52 h-52 mx-auto">
            </div>
            
            <p id="qr-amount" class="text-4xl font-extrabold text-indigo-700 mb-2">₹0</p>
            <p id="qr-name" class="text-gray-800 font-bold text-lg"></p>
            <p id="qr-upi" class="text-gray-500 text-sm font-mono mt-1 bg-gray-50 inline-block px-3 py-1 rounded-full border"></p>
        </div>
    </div>

    <div id="modal-image" class="fixed inset-0 bg-black/95 hidden z-[80] flex flex-col backdrop-blur-md">
        <div class="flex justify-end p-5">
            <button onclick="closeModal('modal-image')" class="text-white text-3xl hover:text-red-500 transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 flex items-center justify-center p-4 overflow-hidden">
            <img id="full-image-src" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl">
        </div>
    </div>

    <div id="modal-confirm" class="fixed inset-0 bg-black/60 hidden z-[90] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-red-100 mb-4 shadow-inner">
                <i class="fa-solid fa-triangle-exclamation text-red-600 text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2" id="confirm-title">Attention</h3>
            <p class="text-sm text-gray-600 mb-6 font-medium" id="confirm-msg">Are you sure?</p>
            <div class="flex gap-3">
                <button onclick="closeModal('modal-confirm')" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-200 transition">Cancel</button>
                <button id="confirm-btn-yes" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 shadow-md transition">Yes, Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-gray-900/95 text-white px-5 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-[100] flex items-center gap-3 backdrop-blur-sm border border-gray-700">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400 text-lg"></i>
        <span id="toast-msg" class="text-sm font-semibold tracking-wide">Message</span>
    </div>

    <script>
        // State Management
        let persons = JSON.parse(localStorage.getItem('hisaab_data_v3')) || [];
        let myUpiSettings = JSON.parse(localStorage.getItem('hisaab_upi')) || { id: '', name: '' };
        
        let currentDetailPersonId = null;
        let confirmCallback = null;
        let base64Image = null;
        let currentTab = 'lent'; // 'lent' = Maine Diye, 'borrowed' = Maine Liye
        let toastTimeout = null; // Fix for Toast overlap bug

        // Utility Functions
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substring(2);
        
        const formatCurrency = (amt) => {
            const num = Number(amt);
            if (isNaN(num)) return '₹0';
            return '₹' + num.toLocaleString('en-IN');
        };
        
        const formatDate = (dateStr) => {
            if(!dateStr) return '';
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('hi-IN', options);
        };

        // Get perfectly localized YYYY-MM-DD to avoid timezone bugs
        const getLocalDateString = (dateObj = new Date()) => {
            const tzOffset = dateObj.getTimezoneOffset() * 60000;
            return (new Date(dateObj.getTime() - tzOffset)).toISOString().split('T')[0];
        };

        // Utility: Calculate Totals based on Category
        function calcTotals(person) {
            let given = 0; let received = 0;
            person.transactions.forEach(t => {
                if(t.type === 'given') given += Number(t.amount);
                if(t.type === 'received') received += Number(t.amount);
            });
            let category = person.category || 'lent'; 
            
            let pending;
            if (category === 'lent') {
                pending = given - received; // They owe me
            } else {
                pending = received - given; // I owe them (I took = received, I paid = given)
            }
            return { given, received, pending, category };
        }

        // Initialize App
        function init() {
            // Data Migration for old versions
            let needsSave = false;
            persons.forEach(p => { if(!p.category) { p.category = 'lent'; needsSave = true; } });
            if(needsSave) saveData(false);
            
            switchTab('lent');
        }

        // Storage Save with Try-Catch (Bug fix for Storage Quota Exceeded)
        function saveData(reRender = true) {
            try {
                localStorage.setItem('hisaab_data_v3', JSON.stringify(persons));
                if(reRender) {
                    renderDashboard();
                    // Fix: Only render timeline if the details modal is actually open
                    if(currentDetailPersonId && !document.getElementById('modal-details').classList.contains('hidden')) {
                        renderTimeline(currentDetailPersonId);
                    }
                }
            } catch (error) {
                console.error("Storage Error:", error);
                showToast("Memory Full! Purani photo delete karein.", "error");
            }
        }

        // Switch between Tabs (Diye vs Liye)
        function switchTab(tab) {
            currentTab = tab;
            
            const btnLent = document.getElementById('tab-lent');
            const btnBorrowed = document.getElementById('tab-borrowed');
            
            if(tab === 'lent') {
                btnLent.className = "flex-1 py-2.5 text-sm font-bold rounded-md bg-white text-indigo-700 shadow transition flex items-center justify-center gap-2";
                btnBorrowed.className = "flex-1 py-2.5 text-sm font-bold rounded-md text-indigo-100 hover:text-white transition flex items-center justify-center gap-2";
                document.getElementById('btn-add-khata').innerHTML = `<i class="fa-solid fa-plus text-lg"></i> Naya Udhaar (Diya)`;
            } else {
                btnBorrowed.className = "flex-1 py-2.5 text-sm font-bold rounded-md bg-white text-indigo-700 shadow transition flex items-center justify-center gap-2";
                btnLent.className = "flex-1 py-2.5 text-sm font-bold rounded-md text-indigo-100 hover:text-white transition flex items-center justify-center gap-2";
                document.getElementById('btn-add-khata').innerHTML = `<i class="fa-solid fa-plus text-lg"></i> Naya Udhaar (Liya)`;
            }
            renderDashboard();
        }

        // Render Main List View
        function renderDashboard() {
            let globalTotalReceive = 0; 
            let globalTotalPay = 0;     

            const listEl = document.getElementById('main-list');
            listEl.innerHTML = '';

            persons.forEach(person => {
                const totals = calcTotals(person);
                if (totals.category === 'lent') {
                    if (totals.pending > 0) globalTotalReceive += totals.pending;
                } else {
                    if (totals.pending > 0) globalTotalPay += totals.pending;
                }
            });

            document.getElementById('dash-total-receive').innerText = formatCurrency(globalTotalReceive);
            document.getElementById('dash-total-pay').innerText = formatCurrency(globalTotalPay);

            const filteredPersons = persons.filter(p => (p.category || 'lent') === currentTab);

            if (filteredPersons.length === 0) {
                listEl.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-400 absolute inset-0">
                        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                            <i class="fa-solid fa-book-open text-4xl text-gray-300"></i>
                        </div>
                        <p class="text-lg font-semibold text-gray-600">Koi hisaab nahi hai.</p>
                        <p class="text-sm mt-1">Naya khata jodne ke liye neeche click karein.</p>
                    </div>`;
                return;
            }

            filteredPersons.forEach(person => {
                const totals = calcTotals(person);
                const isCleared = totals.pending <= 0 && person.transactions.length > 0;
                const isLent = totals.category === 'lent';
                
                const label1 = isLent ? "Diye (-)" : "Liye (+)";
                const val1 = isLent ? totals.given : totals.received;
                
                const label2 = isLent ? "Aaye (+)" : "Chukaye (-)";
                const val2 = isLent ? totals.received : totals.given;

                const card = document.createElement('div');
                card.className = `p-4 mb-4 rounded-2xl shadow-sm border ${isCleared ? 'bg-green-50/50 border-green-200' : 'bg-white border-gray-200'} cursor-pointer hover:shadow-md transition relative`;
                card.onclick = (e) => { 
                    if(!e.target.closest('.btn-quick-edit')) openDetails(person.id); 
                };

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3.5">
                            <div class="bg-gradient-to-br from-indigo-500 to-indigo-600 text-white w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl shadow-inner">
                                ${person.name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900 text-lg flex items-center gap-2">
                                    ${person.name}
                                    <button onclick="event.stopPropagation(); quickEditName('${person.id}')" class="btn-quick-edit text-gray-400 hover:text-indigo-600 bg-gray-100 p-1.5 rounded-full transition"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                </h3>
                                ${isCleared 
                                    ? `<span class="text-[10px] bg-green-100 border border-green-200 text-green-700 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1 mt-1 tracking-wide"><i class="fa-solid fa-check-double"></i> HISAAB CLEAR</span>` 
                                    : `<span class="text-xs text-gray-500 mt-1 inline-block font-medium">${person.transactions.length} entries</span>`}
                            </div>
                        </div>
                        <div class="text-right">
                            <i class="fa-solid fa-chevron-right text-gray-300 text-sm"></i>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 bg-gray-50/80 rounded-xl p-3 border border-gray-100/50">
                        <div class="text-center"><p class="text-[10px] text-gray-500 uppercase font-semibold mb-0.5 tracking-wider">${label1}</p><p class="text-sm font-bold text-red-500">${formatCurrency(val1)}</p></div>
                        <div class="text-center border-l border-r border-gray-200"><p class="text-[10px] text-gray-500 uppercase font-semibold mb-0.5 tracking-wider">${label2}</p><p class="text-sm font-bold text-green-600">${formatCurrency(val2)}</p></div>
                        <div class="text-center"><p class="text-[10px] text-gray-500 uppercase font-semibold mb-0.5 tracking-wider">Baaki</p><p class="text-sm font-extrabold ${isCleared ? 'text-green-600' : 'text-indigo-700'}">${formatCurrency(Math.abs(totals.pending))}</p></div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // Form Handling (Add/Edit)
        function openFormModal(personId = null, txnId = null) {
            document.getElementById('form-person-id').value = personId || '';
            document.getElementById('form-txn-id').value = txnId || '';
            removeImage(); 
            
            const typeSelector = document.getElementById('type-selector');
            const btnGiven = document.getElementById('btn-type-given');
            const btnReceived = document.getElementById('btn-type-received');

            let category = currentTab;
            if (personId) {
                const person = persons.find(p => p.id === personId);
                if (person) category = person.category || 'lent';
            }

            if (category === 'lent') {
                btnGiven.innerText = "Diye (-)"; 
                btnReceived.innerText = "Aaye (+)";
            } else {
                btnReceived.innerText = "Liye (+)"; 
                btnGiven.innerText = "Chukaye (-)"; 
            }

            if (personId) {
                const person = persons.find(p => p.id === personId);
                document.getElementById('form-name').value = person.name;
                
                if (txnId) {
                    const txn = person.transactions.find(t => t.id === txnId);
                    document.getElementById('form-title').innerText = "Record Badlein";
                    setTxnType(txn.type, category);
                    typeSelector.classList.add('hidden'); // Lock type in edit mode
                    document.getElementById('form-amount').value = txn.amount;
                    document.getElementById('form-date').value = txn.date || getLocalDateString();
                    document.getElementById('form-note').value = txn.note || '';
                    if(txn.image) {
                        base64Image = txn.image;
                        document.getElementById('form-image-preview').src = base64Image;
                        document.getElementById('image-preview-container').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('form-title').innerText = "Nayi Entry Jodein";
                    document.getElementById('form-amount').value = '';
                    document.getElementById('form-note').value = '';
                    document.getElementById('form-date').value = getLocalDateString();
                }
            } else {
                document.getElementById('form-title').innerText = category === 'lent' ? "Naya Khata (Diya)" : "Naya Khata (Liya)";
                typeSelector.classList.remove('hidden');
                document.getElementById('form-name').value = '';
                document.getElementById('form-amount').value = '';
                document.getElementById('form-note').value = '';
                document.getElementById('form-date').value = getLocalDateString();
                
                setTxnType(category === 'lent' ? 'given' : 'received', category);
            }
            
            openModal('modal-form');
        }

        function setTxnType(type, category = currentTab) {
            document.getElementById('form-txn-type').value = type;
            const btnGiven = document.getElementById('btn-type-given');
            const btnReceived = document.getElementById('btn-type-received');
            
            const isRedType = (category === 'lent' && type === 'given') || (category === 'borrowed' && type === 'received');
            
            if(type === 'given') {
                btnGiven.className = `flex-1 py-2.5 rounded-lg text-sm font-bold bg-white shadow-sm transition ${isRedType ? 'text-red-600 border border-red-200' : 'text-green-600 border border-green-200'}`;
                btnReceived.className = "flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-500 bg-gray-100 transition border border-transparent";
            } else {
                btnReceived.className = `flex-1 py-2.5 rounded-lg text-sm font-bold bg-white shadow-sm transition ${isRedType ? 'text-red-600 border border-red-200' : 'text-green-600 border border-green-200'}`;
                btnGiven.className = "flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-500 bg-gray-100 transition border border-transparent";
            }
        }

        function openFormForExisting(type) {
            const person = persons.find(p => p.id === currentDetailPersonId);
            openFormModal(currentDetailPersonId);
            
            if(person.category === 'lent') {
                document.getElementById('form-title').innerText = type === 'given' ? 'Aur Paise Diye' : 'Paise Wapas Aaye';
            } else {
                document.getElementById('form-title').innerText = type === 'received' ? 'Aur Paise Liye' : 'Paise Chukaye';
            }
            
            document.getElementById('type-selector').classList.add('hidden');
            setTxnType(type, person.category);
        }

        function saveTransaction() {
            const personId = document.getElementById('form-person-id').value;
            const txnId = document.getElementById('form-txn-id').value;
            const type = document.getElementById('form-txn-type').value;
            const amount = document.getElementById('form-amount').value;
            const date = document.getElementById('form-date').value;
            const note = document.getElementById('form-note').value;
            const name = document.getElementById('form-name').value.trim();

            if (!amount || isNaN(amount) || amount <= 0) return showToast("Sahi amount likhein!", "error");
            if (!date) return showToast("Date select karein!", "error");

            const txnData = { id: txnId || generateId(), type, amount: Number(amount), date, note, image: base64Image };

            if (personId) {
                const person = persons.find(p => p.id === personId);
                if(name && name !== person.name) person.name = name; // Auto-update name
                
                if (txnId) {
                    const idx = person.transactions.findIndex(t => t.id === txnId);
                    if(idx !== -1) person.transactions[idx] = txnData;
                    showToast("Record update ho gaya");
                } else {
                    person.transactions.push(txnData);
                    showToast("Nayi entry add ho gayi");
                }
            } else {
                if (!name) return showToast("Naam likhna zaroori hai!", "error");
                persons.push({
                    id: generateId(),
                    name: name,
                    category: currentTab,
                    transactions: [txnData]
                });
                showToast("Naya khata ban gaya!");
            }

            saveData();
            closeModal('modal-form');
        }

        // Timeline & Details
        function openDetails(personId) {
            currentDetailPersonId = personId;
            renderTimeline(personId);
            openModal('modal-details');
        }

        function renderTimeline(personId) {
            const person = persons.find(p => p.id === personId);
            if(!person) {
                closeModal('modal-details');
                return;
            }

            document.getElementById('detail-name').innerText = person.name;
            const totals = calcTotals(person);
            const isLent = totals.category === 'lent';
            const isCleared = totals.pending <= 0 && person.transactions.length > 0;
            
            const pendingEl = document.getElementById('detail-pending');
            const pendingLabelEl = document.getElementById('detail-pending-label');
            const reminderActions = document.getElementById('reminder-actions');
            
            pendingEl.innerText = formatCurrency(Math.abs(totals.pending));
            
            if(isCleared) {
                pendingEl.className = "font-bold text-green-600 text-3xl";
                pendingLabelEl.innerText = "Hisaab Barabar ✓";
                reminderActions.classList.add('hidden');
            } else {
                pendingEl.className = "font-bold text-indigo-700 text-3xl";
                pendingLabelEl.innerText = isLent ? "Baaki Lene Hain:" : "Baaki Dene Hain:";
                reminderActions.classList.remove('hidden');
                
                document.getElementById('btn-reminder').onclick = () => {
                    let msg = '';
                    if(isLent) {
                        msg = `Namaste ${person.name}, Hisaab Book ke anusaar aapka ${formatCurrency(totals.pending)} ka udhaar baaki hai.\n\n`;
                        if(myUpiSettings.id) msg += `Aap is UPI ID par paise bhej sakte hain:\nUPI ID: ${myUpiSettings.id}\nNaam: ${myUpiSettings.name}\n\nDhanyawad.`;
                    } else {
                        msg = `Namaste ${person.name}, Hisaab Book ke anusaar mujhe aapko ${formatCurrency(totals.pending)} dene hain. Main jald hi aapka payment kar dunga. Kripya apna QR Code ya UPI bhej dijiye.\n\nDhanyawad.`;
                    }
                    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
                };
                
                const qrBtn = document.getElementById('btn-show-qr');
                if(isLent) {
                    qrBtn.classList.remove('hidden');
                    qrBtn.onclick = () => {
                        if(!myUpiSettings.id) return showConfirm("QR code ke liye pehle Settings mein UPI ID set karein.", () => openUpiSettings(), "UPI Missing");
                        const upiString = `upi://pay?pa=${myUpiSettings.id}&pn=${encodeURIComponent(myUpiSettings.name)}&am=${totals.pending}&cu=INR`;
                        document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
                        document.getElementById('qr-amount').innerText = formatCurrency(totals.pending);
                        document.getElementById('qr-name').innerText = `To: ${myUpiSettings.name}`;
                        document.getElementById('qr-upi').innerText = myUpiSettings.id;
                        openModal('modal-qr');
                    };
                } else {
                    qrBtn.classList.add('hidden');
                }
            }

            const actionLeft = document.getElementById('btn-action-left');
            const actionRight = document.getElementById('btn-action-right');
            
            if(isLent) {
                actionLeft.onclick = () => openFormForExisting('received');
                actionLeft.innerHTML = `<i class="fa-solid fa-arrow-down"></i> Aaye (+)`;
                actionRight.onclick = () => openFormForExisting('given');
                actionRight.innerHTML = `<i class="fa-solid fa-arrow-up"></i> Aur Diye (-)`;
            } else {
                actionLeft.onclick = () => openFormForExisting('given');
                actionLeft.innerHTML = `<i class="fa-solid fa-arrow-up"></i> Chukaye (-)`;
                actionRight.onclick = () => openFormForExisting('received');
                actionRight.innerHTML = `<i class="fa-solid fa-arrow-down"></i> Aur Liye (+)`;
            }

            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            // Bug Fix: Sorting by date strictly (secondary sort by ID just in case)
            const sortedTxns = [...person.transactions].sort((a, b) => {
                const d = new Date(b.date) - new Date(a.date);
                return d !== 0 ? d : (b.id > a.id ? 1 : -1);
            });

            sortedTxns.forEach(txn => {
                const increasesDebt = (isLent && txn.type === 'given') || (!isLent && txn.type === 'received');
                
                const colorClass = increasesDebt ? 'text-red-600' : 'text-green-600';
                const bgClass = increasesDebt ? 'bg-red-50 border-red-200' : 'bg-green-50 border-green-200';
                const iconClass = increasesDebt ? (isLent ? 'fa-arrow-up text-red-500' : 'fa-arrow-down text-red-500') : (isLent ? 'fa-arrow-down text-green-500' : 'fa-arrow-up text-green-500');
                
                let actionText = '';
                if(isLent) actionText = txn.type === 'given' ? 'Diye' : 'Aaye';
                else actionText = txn.type === 'received' ? 'Liye' : 'Chukaye';

                const imgHtml = txn.image ? `<img src="${txn.image}" onclick="viewFullImage('${txn.image}')" class="mt-3 h-20 w-20 object-cover rounded-xl border-2 border-white shadow-sm cursor-pointer hover:opacity-80 transition hover:scale-105">` : '';

                const itemHtml = `
                    <div class="relative z-10 flex gap-4 mb-5">
                        <div class="w-8 h-8 rounded-full bg-white border-2 border-gray-200 flex items-center justify-center shrink-0 shadow-sm mt-1 z-10">
                            <i class="fa-solid ${iconClass} text-[10px]"></i>
                        </div>
                        <div class="flex-1 ${bgClass} border rounded-2xl p-4 shadow-sm relative transition-all">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-extrabold ${colorClass} text-xl">${increasesDebt ? '-' : '+'}${formatCurrency(txn.amount)}</p>
                                    <p class="text-[10px] uppercase font-bold text-gray-500 tracking-wider mb-1.5">${actionText}</p>
                                    <p class="text-xs text-gray-600 font-medium"><i class="fa-regular fa-calendar mr-1"></i> ${formatDate(txn.date)}</p>
                                    ${txn.note ? `<p class="text-sm text-gray-700 mt-2.5 bg-white/60 p-2.5 rounded-lg border border-white/50">${txn.note}</p>` : ''}
                                    ${imgHtml}
                                </div>
                            </div>
                            <div class="mt-4 flex gap-2 border-t border-gray-200/60 pt-3">
                                <button onclick="openFormModal('${personId}', '${txn.id}')" class="flex-1 py-2 text-xs font-bold text-gray-700 bg-white hover:bg-gray-100 rounded-lg shadow-sm border border-gray-200 transition"><i class="fa-solid fa-pen mr-1"></i> Edit</button>
                                <button onclick="deleteTransaction('${personId}', '${txn.id}')" class="flex-1 py-2 text-xs font-bold text-red-600 bg-white hover:bg-red-50 rounded-lg shadow-sm border border-red-100 transition"><i class="fa-solid fa-trash mr-1"></i> Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += itemHtml;
            });
        }

        // Feature: Quick Edit Name
        function quickEditName(personId) {
            currentDetailPersonId = personId;
            openEditName();
        }

        function openEditName() {
            const person = persons.find(p => p.id === currentDetailPersonId);
            if(person) {
                document.getElementById('edit-name-input').value = person.name;
                openModal('modal-name');
            }
        }

        function saveName() {
            const newName = document.getElementById('edit-name-input').value.trim();
            if(!newName) return showToast("Naam khali nahi ho sakta", "error");
            
            const person = persons.find(p => p.id === currentDetailPersonId);
            if(person) {
                person.name = newName;
                saveData();
                closeModal('modal-name');
                if(!document.getElementById('modal-details').classList.contains('hidden')) {
                    document.getElementById('detail-name').innerText = newName;
                }
                showToast("Naam update ho gaya!");
            }
        }

        // Delete Operations
        function deletePerson() {
            showConfirm("Kya aap is insaan ka poora khata delete karna chahte hain? Sab record udd jayenge.", () => {
                persons = persons.filter(p => p.id !== currentDetailPersonId);
                saveData();
                closeModal('modal-details');
                showToast("Khata hamesha ke liye delete ho gaya");
            }, "Delete Khata?");
        }

        function deleteTransaction(personId, txnId) {
            showConfirm("Kya aap ye payment record delete karna chahte hain?", () => {
                const person = persons.find(p => p.id === personId);
                person.transactions = person.transactions.filter(t => t.id !== txnId);
                saveData();
                showToast("Record delete ho gaya");
            }, "Delete Record?");
        }

        // Image Handling (Auto-compress)
        document.getElementById('form-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; // Compressed more to save storage
                    let scaleSize = 1;
                    if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                    
                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    base64Image = canvas.toDataURL('image/jpeg', 0.5); // 50% quality
                    document.getElementById('form-image-preview').src = base64Image;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function removeImage() {
            base64Image = null;
            document.getElementById('form-image').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        function viewFullImage(src) {
            document.getElementById('full-image-src').src = src;
            openModal('modal-image');
        }

        // UPI Settings
        function openUpiSettings() {
            document.getElementById('upi-name').value = myUpiSettings.name || '';
            document.getElementById('upi-id').value = myUpiSettings.id || '';
            openModal('modal-upi');
        }

        function saveUpiSettings() {
            const name = document.getElementById('upi-name').value.trim();
            const id = document.getElementById('upi-id').value.trim();
            if(!id) return showToast("UPI ID likhna zaroori hai", "error");
            
            myUpiSettings = { name, id };
            localStorage.setItem('hisaab_upi', JSON.stringify(myUpiSettings));
            closeModal('modal-upi');
            showToast("UPI Settings save ho gayi!");
        }

        // UI Helpers
        function openModal(id) { 
            document.getElementById(id).classList.remove('hidden'); 
        }
        function closeModal(id) { 
            document.getElementById(id).classList.add('hidden'); 
            // Bug Fix: Clear memory when closing detail modal
            if(id === 'modal-details') {
                currentDetailPersonId = null;
            }
        }

        function showConfirm(msg, callback, title="Confirm") {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            confirmCallback = callback;
            
            const yesBtn = document.getElementById('confirm-btn-yes');
            yesBtn.onclick = () => { closeModal('modal-confirm'); if(confirmCallback) confirmCallback(); };
            openModal('modal-confirm');
        }

        // Bug Fix: Clear Timeout to prevent toast overlaps
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            const icon = document.getElementById('toast-icon');
            
            icon.className = type === "success" ? "fa-solid fa-circle-check text-green-400 text-lg" : "fa-solid fa-triangle-exclamation text-red-400 text-lg";

            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            if(toastTimeout) clearTimeout(toastTimeout);
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
